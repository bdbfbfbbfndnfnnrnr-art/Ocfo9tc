2<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر ودردشة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }
        .main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        .player-box {
            flex: 65;
            height: 100%;
            background-color: #000;
        }
        .player-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .chat-box {
            flex: 35;
            height: 100%;
            background-color: #1c2733;
            overflow-y: auto;
            padding: 5px;
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            html, body {
                overflow: auto;
            }
            .player-box {
                height: 40vh;
                flex: none;
            }
            .chat-box {
                height: 60vh;
                flex: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- قسم المشغل مع منع الإعلانات المنبثقة وحظر إعادة التوجيه -->
        <div class="player-box">
            <iframe 
                src="https://1cdn.syria-player.info/play.php?channel=bein3" 
                allowfullscreen 
                scrolling="no"
                sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>

        <!-- قسم الدردشة -->
        <div class="chat-box">
            <script async src="https://telegram.org/js/telegram-widget.js?24" data-telegram-discussion="bdbebebjeje/36" data-comments-limit="10" data-colorful="1" data-dark="1"></script>
        </div>
    </div>

</body>
</html>
